# Used explicitly by the Kitty shortcut and :DotfilesGit on both platforms.
gui:
  mouseEvents: true
  showRandomTip: false
  nerdFontsVersion: "3"
  theme:
    activeBorderColor: ["#e6a6c7", bold]
    inactiveBorderColor: ["#65536e"]
    optionsTextColor: ["#b7c3eb"]
    selectedLineBgColor: ["#51384c"]
    defaultFgColor: ["#eee5ef"]
    unstagedChangesColor: ["#f095a8"]
git:
  autoFetch: false
  autoForwardBranches: none
  autoStageResolvedConflicts: false
update:
  method: never
