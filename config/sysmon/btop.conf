# Shared, read-only starting layout. sysmon selects the active desktop theme.
# btop drops gpu0 and keeps CPU/RAM/network/processes when no GPU is available.
color_theme = "dark-rose"
theme_background = false
truecolor = true
rounded_corners = true
terminal_sync = true
graph_symbol = "braille"
shown_boxes = "cpu gpu0 mem net proc"
update_ms = 2000
save_config_on_exit = false
vim_keys = true
proc_sorting = "cpu direct"
proc_tree = false
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_gradient = false
proc_follow_detailed = true
cpu_graph_upper = "total"
cpu_graph_lower = "Auto"
show_gpu_info = "On"
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
temp_scale = "celsius"
show_cpu_freq = true
freq_mode = "range"
clock_format = "%H:%M:%S"
mem_graphs = true
show_swap = true
swap_disk = false
show_disks = true
only_physical = true
disk_free_priv = false
show_io_stat = true
io_mode = false
io_graph_combined = false
net_auto = true
net_sync = true
net_iface = ""
show_battery = true
show_battery_watts = true
nvml_measure_pcie_speeds = true
rsmi_measure_pcie_speeds = true
shown_gpus = "nvidia amd intel apple"
log_level = "WARNING"
