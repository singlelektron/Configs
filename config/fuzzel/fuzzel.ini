[main]
font=JetBrainsMonoNL Nerd Font Mono:size=12
terminal=kitty -e
prompt="❯ "
lines=10
width=48
horizontal-pad=20
vertical-pad=16
inner-pad=8
icons-enabled=yes
icon-theme=Adwaita
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=241d29ff
text=ede5ecff
prompt=f2a5c7ff
placeholder=b3a2b1ff
input=ede5ecff
match=9bcbd3ff
selection=3b2c3bff
selection-text=ede5ecff
selection-match=f2a5c7ff
border=f2a5c7ff

[border]
width=2
radius=8
