# Shared across macOS and Linux. Keep Kitty's standard shortcuts.
font_family family="JetBrainsMonoNL Nerd Font Mono"
font_size 13.0
disable_ligatures always
# GUI-launched shells should find uv tools and rustup without taking over shell rc.
env PATH=${HOME}/.local/bin:${HOME}/.cargo/bin:${PATH}

background_opacity 0.88
dynamic_background_opacity yes
window_padding_width 8
remember_window_size yes
initial_window_width 120c
initial_window_height 32c
tab_bar_style separator
tab_bar_min_tabs 1
tab_bar_edge top
tab_title_template " {index}: {title} "
enable_audio_bell no
scrollback_lines 10000

# Keep close confirmation and Kitty's default clipboard permissions.
# Split beside an agent or a shell without changing Ctrl/Alt Vim keys.
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t new_tab_with_cwd
# Mouse-enabled Git UI; shell expansion honors custom XDG paths on both OSes.
map ctrl+shift+g launch --type=tab --cwd=current sh -c 'exec lazygit --use-config-file "${XDG_CONFIG_HOME:-$HOME/.config}/lazygit/config.yml"'

include theme.conf
include platform.conf
# Private, machine-specific settings stay outside this repository.
globinclude ../dotfiles-local/kitty.conf
